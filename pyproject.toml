[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evogen-harness"
dynamic = ["version"]
description = "Attribution-guided evolution of generator-external image-generation harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Jiabin Luo"},
  {name = "Yinan Liu"},
  {name = "Chunlei Meng"},
  {name = "Yufei Guo"},
]
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]

[project.scripts]
evogen-harness = "gen_harness.cli:main"

[project.urls]
Repository = "https://github.com/King-play/EvoGen-Harness"
Project = "https://king-play.github.io/EvoGen-Harness/"
Paper = "https://arxiv.org/abs/2610.00383"
Issues = "https://github.com/King-play/EvoGen-Harness/issues"

[tool.setuptools.packages.find]
include = ["gen_harness*"]

[tool.setuptools.dynamic]
version = {attr = "gen_harness.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
