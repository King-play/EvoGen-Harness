name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile and test
        run: |
          python -m compileall -q gen_harness scripts
          python -m pytest -q
          python scripts/check_release.py
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Audit release boundaries
        run: |
          python -m gen_harness.cli audit-components --harness examples/visual_harness --output /tmp/component-audit.json
          python -m gen_harness.cli open-source-check --root . --ignore-local-files --fail-on-findings
